name: Build Personal APK

on:
  push:
    branches: [personal]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Generate keystore.properties
        run: |
          echo "keystore.file=keystore/personal.p12" >> keystore.properties
          echo "keystore.password=tp-8aebbfebc5932fe373bad835d9154462" >> keystore.properties
          echo "keystore.key.alias=tiebapure" >> keystore.properties
          echo "keystore.key.password=tp-8aebbfebc5932fe373bad835d9154462" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Read Output Metadata
        id: meta
        uses: juliangruber/read-file-action@v1
        with:
          path: ./app/build/outputs/apk/release/output-metadata.json
          trim: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ fromJSON(steps.meta.outputs.content).elements[0].versionName }}
          VERSION_CODE: ${{ fromJSON(steps.meta.outputs.content).elements[0].versionCode }}
        run: |
          TAG="personal-r${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --title "FluxTie ${VERSION_NAME} (${VERSION_CODE}) 平行视窗版 $TAG" \
            --notes "自动构建 personal 分支：应用内平行视窗（平板双栏：左列表 / 右帖子详情）。安装前请先卸载官方版（签名不同）。" \
            --target personal \
            ./app/build/outputs/apk/release/*.apk
